slug: disputes
order: 7
name: Fast Disputes
accent: "#7e22ce"
accent_dark: "#d8b4fe"
tagline: Settle small disputes over agent orders in a day — for less than it costs to argue about them.
audience: For shops and platforms that receive orders placed by AI agents, and for the people those agents buy for.

problem: |
  When an AI agent orders the wrong size, books the wrong date or misreads the terms, someone has to sort it out. For a €15 order, the emails and phone calls cost more than the order itself.

  Card chargebacks are slow and blunt, and no one goes to court over €15 — so today these disputes either drag on or get quietly written off.

how_it_works:
  - title: Send the dispute in one call
    text: Submit the order, both sides' accounts and the agent's own logs — everything in one go.
  - title: The case is reviewed
    text: Trained reviewers compare the order details, the terms and the agent's instructions against what actually happened.
  - title: Get a written decision
    text: Both sides receive a short, reasoned decision within a day, in a format their systems can act on automatically.

benefits:
  - title: Fast
    text: Decisions arrive within a day, instead of dragging on for weeks.
  - title: Less work
    text: One submission sends the whole case — no days of back-and-forth emails.
  - title: Reasoned
    text: Every decision explains which facts mattered, in plain language.
  - title: Ready to act on
    text: Outcomes arrive as data your systems can process directly — refund, replace or close.

audiences:
  - label: For shops and platforms
    pitch: Stop spending support hours on small agent-order disputes. Send them here and get a decision tomorrow.
  - label: For people
    pitch: When your agent's order goes wrong, get a quick, fair decision without fighting your way through support.
  - label: For agents
    agent: true
    pitch: open_dispute(order_id, claim, evidence) returns a case ID; get_decision(case_id) returns the outcome and reasons.

demo:
  intro: A shop opens a dispute after an AI agent ordered the wrong shoe size for its owner.
  tool:
    name: open_dispute
    description: Open a case about an order placed by an agent.
    inputs:
      - name: order_id
        type: string
        required: true
        description: The order the dispute is about.
      - name: claim
        type: string
        required: true
        description: What went wrong, in one or two sentences.
      - name: evidence
        type: array
        required: false
        description: Order records, messages or agent logs that support the claim.
    returns: A case ID and the expected decision time.
  example_request:
    order_id: "ord_66120"
    claim: "Customer's agent ordered size 44; customer says the instruction was size 42."
    evidence: ["order_record.json", "agent_instruction_log.json"]
  example_response:
    case_id: "case_1874"
    status: under_review
    decision_expected_by: "2026-10-05T20:00:00+01:00"

faq:
  - q: Who makes the decision?
    a: Trained reviewers, supported by tools that compare the order records with the agent's instructions.
  - q: Do both sides have to agree to use it?
    a: Yes. Platforms can include it in their terms so it applies automatically to all agent orders.
  - q: What size of dispute fits?
    a: It is designed for small orders, where normal dispute handling costs more than the order itself.

related: [recorder, bids]
