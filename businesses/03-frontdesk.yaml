slug: frontdesk
order: 3
name: Agent Front Desk
accent: "#b45309"
accent_dark: "#fcd34d"
tagline: When customers ask an AI assistant to book a plumber or a table, make sure they can still book you.
audience: For small businesses that take bookings by phone, message or a simple calendar.

problem: |
  More and more people ask an AI assistant to find and book local services for them. The assistant books whichever business it can actually reach — and that is rarely the one with a phone and a paper diary.

  Big chains already take these bookings. If your business does not, the booking quietly goes to someone else, and you never even know you missed it.

how_it_works:
  - title: Connect what you already use
    text: Link your existing calendar, phone number or messaging app. Setup takes about ten minutes.
  - title: Describe your services
    text: Add what you offer, where you work, your hours and your usual prices — in plain language, no technical knowledge needed.
  - title: Take bookings from agents
    text: AI assistants can check your availability and book you. Each booking lands in your calendar like any other.

benefits:
  - title: Bookings from a new channel
    text: Requests that come through AI assistants reach you instead of going to a competitor.
  - title: Missed calls answered
    text: Calls you cannot pick up still get a reply and, where possible, become a booking.
  - title: No new system to learn
    text: You keep working from the same calendar and phone you use today.
  - title: Always-current details
    text: Update your hours or prices once, and every assistant sees the new version at once.

audiences:
  - label: For business owners
    pitch: Win bookings from AI assistants without changing how you work, and stop losing jobs to calls you could not answer.
  - label: For agents
    agent: true
    pitch: find_availability(service, area, window) returns bookable slots; book_slot(slot_id, customer) confirms one.
  - label: For people booking through an assistant
    pitch: Book the local businesses you actually like through your assistant, not only the ones with big websites.

demo:
  intro: An AI assistant looks for a plumber in Dublin who can come tomorrow morning.
  tool:
    name: find_availability
    description: Find open slots for a service from local businesses in an area.
    inputs:
      - name: service
        type: string
        required: true
        description: What the customer needs, in plain words.
      - name: area
        type: string
        required: true
        description: The town, district or postcode to search in.
      - name: window
        type: object
        required: true
        description: The earliest and latest start times the customer can accept.
    returns: A list of businesses with open slots, typical price ranges and a slot ID for booking.
  example_request:
    service: "leaking kitchen tap"
    area: "Rathmines, Dublin 6"
    window: { from: "2026-10-05T08:00:00+01:00", to: "2026-10-05T12:00:00+01:00" }
  example_response:
    results:
      - business: "Byrne Plumbing"
        slot_id: "slt_5512"
        start: "2026-10-05T09:30:00+01:00"
        typical_price: "€80–€120 call-out"
      - business: "Ranelagh Heating & Plumbing"
        slot_id: "slt_7740"
        start: "2026-10-05T11:00:00+01:00"
        typical_price: "€95 call-out"

faq:
  - q: Do I need a website?
    a: No. A calendar or a phone number is enough to get started.
  - q: Can I approve bookings before they are confirmed?
    a: Yes. You can choose instant booking, or approve each request yourself first.
  - q: Which assistants can reach me?
    a: Any assistant that can call tools through the standard MCP protocol. We publish your details in a format they all read.

related: [mirror, attention]
