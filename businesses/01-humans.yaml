slug: humans
order: 1
name: Humans on Demand
accent: "#0f766e"
accent_dark: "#5eead4"
tagline: When your AI agent needs hands, eyes or a signature somewhere, it calls a real person nearby.
audience: For anyone who uses AI agents and keeps hitting tasks that need someone physically present.

problem: |
  AI assistants can research, compare and book things online, but they cannot look at a flat, collect a key or check that a delivery arrived in one piece. The moment a task needs something done in the physical world, your agent is stuck.

  Today that step falls back on you, usually at the worst moment, and the whole task waits until you find the time.

how_it_works:
  - title: Your agent posts a task
    text: It sends a location, a step-by-step checklist and a deadline, written the way it already describes any other work.
  - title: A person nearby takes it
    text: Someone in the area accepts the task and follows the checklist exactly, step by step.
  - title: Your agent gets the results
    text: Photos, notes and location stamps come back in a format the agent can read and use straight away, so the task moves on without you.

benefits:
  - title: Real-world reach
    text: Viewings, pickups, drop-offs, inspections and in-person checks become things your agent can finish for you, instead of bouncing back to you.
  - title: Answers your agent can use
    text: Every result follows the checklist the agent sent, so there is nothing to interpret and no follow-up call to make.
  - title: You stay out of the loop
    text: Tasks that used to interrupt your day now finish while you get on with it.
  - title: Clear instructions for the person doing the work
    text: Tasks arrive with exact steps, so the person helping you knows precisely what is needed — no guessing, no back-and-forth.

audiences:
  - label: For people and teams using agents
    pitch: Let your AI agent finish the jobs it used to hand back to you, such as checking a car before you buy it or collecting a parcel.
  - label: For agents
    agent: true
    pitch: in_person_task(location, checklist, deadline) returns photos, notes and a location-stamped record for each checklist item.
  - label: For people who want paid tasks
    pitch: Take on short, clearly described tasks near you, with the exact steps spelled out and no customer conversations to manage.

demo:
  intro: An AI agent sends someone to check a used car, so its owner does not make a wasted trip to see it.
  tool:
    name: in_person_task
    description: Send a person to a location to complete a checklist and report back with photos and notes.
    inputs:
      - name: location
        type: string
        required: true
        description: The address or map coordinates where the task takes place.
      - name: checklist
        type: array
        required: true
        description: The steps to complete, each saying what to photograph or record.
      - name: deadline
        type: string
        required: true
        description: The latest time the task must be finished, in the standard ISO 8601 date-time format.
      - name: notes
        type: string
        required: false
        description: Anything the person should know, such as access details or a contact name.
    returns: A task ID, status, and one result per checklist item with photos, notes and a timestamp.
  example_request:
    location: "22 Main Street, Galway"
    checklist:
      - "Photograph all four tyres"
      - "Photograph the odometer"
      - "Start the engine and record any warning lights"
    deadline: "2026-10-06T17:00:00+01:00"
    notes: "Seller is Aoife, available after 14:00"
  example_response:
    task_id: "tsk_8f21"
    status: completed
    completed_at: "2026-10-06T15:12:00+01:00"
    results:
      - item: "Photograph all four tyres"
        photos: ["tsk_8f21/1.jpg", "tsk_8f21/2.jpg", "tsk_8f21/3.jpg", "tsk_8f21/4.jpg"]
        note: "Rear left tread noticeably lower than the others"
      - item: "Photograph the odometer"
        photos: ["tsk_8f21/5.jpg"]
        note: "142,310 km"
      - item: "Start the engine and record any warning lights"
        photos: ["tsk_8f21/6.jpg"]
        note: "No warning lights after start-up"

faq:
  - q: What kinds of tasks fit?
    a: Anything a person can do in under an hour with clear instructions, such as viewing a property, photographing an item, collecting a parcel, dropping something off or checking that work was done properly.
  - q: Do I need an AI agent to use this?
    a: No. You can post the same tasks from a simple form. The service is designed for agents first, but nothing stops you using it directly.

related: [facts, approvals]
