slug: proofs
order: 9
name: Prove It
accent: "#0e7490"
accent_dark: "#67e8f9"
tagline: Prove you are over 18, live locally or can afford the rent — without sending anyone the documents.
audience: For people tired of uploading passports and bank statements, and for the businesses that keep having to ask for them.

problem: |
  Renting a flat, opening an account or booking a car still means sending copies of your passport, payslips and bills to strangers — who then have to store those copies safely.

  Your AI agent will be asked for the same things, and it should not be passing your documents around either.

how_it_works:
  - title: Add your documents once
    text: Your documents are checked a single time and stored in a vault that only you control.
  - title: Someone asks a narrow question
    text: A landlord, shop or another agent asks something specific, such as "is this person over 18?" — not "send me your passport".
  - title: Share the answer, not the document
    text: You or your agent approve, and they receive a signed yes or no. Nothing more.

benefits:
  - title: Less of your data in other people's files
    text: Businesses get the answer they need, not a copy of your passport to keep forever.
  - title: Faster checks
    text: A question that used to mean an upload and a day's wait now takes a tap.
  - title: Safe for your agent to use
    text: Your agent can answer routine checks for you without ever seeing or holding your documents.
  - title: Less risk for businesses
    text: Keep a signed answer on file instead of a folder of sensitive copies you never wanted to be responsible for.

audiences:
  - label: For people
    pitch: Prove what someone needs to know, and keep your passport, payslips and bank statements to yourself.
  - label: For businesses
    pitch: Get a signed answer to the question you actually have, and stop storing documents you never wanted to hold.
  - label: For agents
    agent: true
    pitch: request_proof(subject, question) returns a signed yes or no once the person approves.

demo:
  intro: A letting agent checks whether an applicant's income is above a threshold, without ever seeing a payslip.
  tool:
    name: request_proof
    description: Ask a person to prove a specific fact without revealing the underlying documents.
    inputs:
      - name: subject
        type: string
        required: true
        description: The person's vault address — their identity on this service.
      - name: question
        type: string
        required: true
        description: A yes-or-no question from the supported list.
      - name: purpose
        type: string
        required: true
        description: Why you are asking — this is shown to the person before they approve.
      - name: parameters
        type: object
        required: false
        description: Any values the question needs, such as an income threshold.
    returns: A signed yes or no, the issuer, and the time of the proof.
  example_request:
    subject: "vault:niamh"
    question: "annual_income_above"
    parameters: { value: 45000, currency: EUR }
    purpose: "Rental application for 3 Harbour View"
  example_response:
    answer: true
    signed_by: "proofs issuer key 2026-A"
    issued_at: "2026-10-04T20:44:00+01:00"
    shared_fields: []

faq:
  - q: Which questions can be answered?
    a: Age, residence, identity, and income thresholds.
  - q: Does the business see my documents?
    a: No. They receive only the signed answer to their specific question — never the documents behind it.

related: [mandates, identity]
