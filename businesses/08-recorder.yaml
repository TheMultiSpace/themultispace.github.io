slug: recorder
order: 8
name: Flight Recorder
accent: "#334155"
accent_dark: "#cbd5e1"
tagline: A tamper-evident record of what your AI agent saw, decided and did.
audience: For companies that run AI agents on behalf of customers or staff — and need to answer for what the agents do.

problem: |
  When an AI agent does something unexpected, the first question is why. The second is whether you can prove what really happened.

  Ordinary application logs are scattered across systems, easy to change, and hard for anyone outside your team to read — customers, auditors or regulators.

how_it_works:
  - title: Add one line to your agent
    text: At each step, the agent reports what it saw, what it decided and what it did. Everything goes to the recorder.
  - title: Records are sealed
    text: Each entry is cryptographically chained to the one before it — like a wax seal on every page — so any later change is immediately visible.
  - title: Replay any session
    text: Open the timeline of a session, share it with a customer or export it for an audit.

benefits:
  - title: Clear answers to "why"
    text: See the inputs and reasoning behind every action, in the order they happened.
  - title: Records others can check
    text: Anyone you share a record with can verify for themselves that it has not been altered.
  - title: One place for every agent
    text: Agents from different vendors and frameworks all write to the same timeline.
  - title: Ready for review
    text: Export sessions in a format auditors and regulators can actually read.

audiences:
  - label: For companies running agents
    pitch: Know exactly why your agent did something — and be able to show it to anyone who asks.
  - label: For reviewers and auditors
    pitch: Read a clear, checkable timeline instead of piecing together logs from several different systems.
  - label: For agents
    agent: true
    pitch: record_step(session_id, observed, decided, action) appends a sealed entry and returns its hash.

demo:
  intro: An agent records the step where it chose which flight to book.
  tool:
    name: record_step
    description: Append a sealed entry to a session's timeline.
    inputs:
      - name: session_id
        type: string
        required: true
        description: The session this step belongs to.
      - name: observed
        type: string
        required: true
        description: What the agent saw or received.
      - name: decided
        type: string
        required: true
        description: What it decided, and why, in one sentence.
      - name: action
        type: object
        required: false
        description: The tool call it made, if any.
    returns: The entry's sequence number, hash and the hash of the previous entry.
  example_request:
    session_id: "ses_9c02"
    observed: "Three flights Dublin to Lisbon under €200 on 12 November"
    decided: "Chose the 10:40 departure: cheapest option that arrives before the 15:00 meeting"
    action: { tool: "book_flight", arguments: { flight: "DL-LIS-1040" } }
  example_response:
    sequence: 14
    hash: "bb32f3226797c14388630865218a93d429670f388467e1d2eed7cda8f4bd1068"
    previous_hash: "365c82698b790d9bf398838d3ac45e849a93ab26034b496b1c5257f214016a10"
    recorded_at: "2026-10-04T20:40:12Z"

faq:
  - q: Do you see my customers' data?
    a: You choose what each entry contains, and sensitive fields can be stored as references instead of content.
  - q: Which agent frameworks does it work with?
    a: Any agent that can make an MCP or HTTP call can write to the recorder — it is not tied to one vendor.
  - q: How do others check a record?
    a: A shared record includes its chain of hashes (digital fingerprints), which anyone can check independently.

related: [disputes, simulator]
