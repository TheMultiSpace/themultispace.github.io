slug: router
order: 10
name: Smart Router
accent: "#c2410c"
accent_dark: "#fdba74"
tagline: Describe the task. It goes to whichever provider does it best right now.
audience: For teams building AI agents that rely on outside tools and APIs to get work done.

problem: |
  Most AI agents depend on a handful of outside services — search, transcription, maps, translation — that someone picked months ago and hardcoded in.

  Since then, prices have changed, better providers have appeared, and one of them has been failing every afternoon. Your agent has no way to know any of this.

how_it_works:
  - title: Describe the task
    text: Your agent sends the job, its budget and how fast it needs the result.
  - title: We pick the provider
    text: The call goes to whichever provider is currently performing best within your limits — based on measured results, not habit.
  - title: You get the result and the receipt
    text: The answer comes back together with which provider did it, what it cost and how long it took.

benefits:
  - title: Better results without rework
    text: Providers are chosen on their latest measured performance, not on what you knew at setup time.
  - title: Automatic fallback
    text: When a provider fails or slows down, the next best one takes the call — your agent never gets stuck.
  - title: Lower costs
    text: Set a budget per call, and the cheapest provider that meets it does the work.
  - title: One integration instead of many
    text: Add or swap providers without changing your agent at all.

audiences:
  - label: For agent builders
    pitch: Stop hardcoding vendors. Every call goes to the provider that is best right now, with automatic fallback when one fails.
  - label: For tool providers
    pitch: Win traffic based on how well your service actually performs, not on who signed the first contract.
  - label: For agents
    agent: true
    pitch: route(task, budget, max_latency) returns the result, the provider used, the cost and the time taken.

demo:
  intro: An agent needs a two-minute voice note transcribed quickly and cheaply.
  tool:
    name: route
    description: Send a task to the best available provider within a budget and time limit.
    inputs:
      - name: task
        type: object
        required: true
        description: The type of task and its input.
      - name: budget
        type: object
        required: false
        description: The maximum cost for this call.
      - name: max_latency
        type: string
        required: false
        description: The longest you are willing to wait, as an ISO 8601 duration.
    returns: The provider's result, plus the provider name, cost, latency and any fallbacks used.
  example_request:
    task: { type: "transcribe", input: "voice_note_0412.m4a", language: "en-IE" }
    budget: { value: 0.05, currency: EUR }
    max_latency: "PT20S"
  example_response:
    result: "Hi, it's Declan. I can do Thursday at three if that still suits."
    provider: "Harbour Speech"
    cost: { value: 0.012, currency: EUR }
    latency: "PT4.1S"
    fallbacks_used: ["Liffey Speech timed out after 8s"]

faq:
  - q: How do you decide which provider is best?
    a: We measure each provider's results, speed and cost on real calls and route based on the latest figures.
  - q: Can I exclude or prefer certain providers?
    a: Yes. Each call can include allow and block lists, so you keep the final say.
  - q: Which kinds of tasks are supported?
    a: Search, transcription, translation, and geocoding.

related: [facts, simulator]
