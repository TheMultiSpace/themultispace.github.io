slug: mandates
order: 2
name: Agent Mandates
accent: "#4338ca"
accent_dark: "#a5b4fc"
tagline: Let your AI agent spend money for you — without handing it your card details.
audience: For people who want AI agents to buy things on their behalf, and for shops that want to sell to those agents safely.

problem: |
  Today, letting an AI agent pay for something means giving it your card details — all or nothing. It can spend any amount, anywhere, until you notice.

  Shops have the opposite worry: when an order arrives from a piece of software, they cannot tell who is behind it or what it was actually allowed to buy.

how_it_works:
  - title: You set the rules
    text: Choose a spending limit, what the agent may buy, from which shops, and when the permission expires.
  - title: Your agent carries a mandate
    text: Instead of your card details, it shows a signed permission slip — a mandate — that any shop can check in one quick call.
  - title: You stay in control
    text: Watch every use of the mandate as it happens, and cancel it with one tap the moment you want it to stop.

benefits:
  - title: Limits that actually hold
    text: An agent cannot go past the amount, category or date you set, no matter what it is asked to do.
  - title: One switch to stop everything
    text: Cancelling a mandate ends it everywhere at once, immediately.
  - title: Orders with a name behind them
    text: Shops can see who the agent acts for and what it is permitted to buy before they accept, so they can trust the order.
  - title: Works with your existing payment method
    text: Mandates sit on top of the card or account you already use, so there is nothing new to move your money to.

audiences:
  - label: For people
    pitch: Let your agent book the flights and order the groceries, within limits you choose and can cancel at any moment.
  - label: For shops and platforms
    pitch: Accept orders from AI agents with confidence — before you ship, you can see who they act for and what they are allowed to spend.
  - label: For agents
    agent: true
    pitch: check_mandate(mandate_id, merchant, amount, category) returns whether a purchase is within the owner's permission.

demo:
  intro: A shop checks whether an incoming order from an AI agent is covered by its owner's mandate.
  tool:
    name: check_mandate
    description: Check whether a purchase falls within the permission an owner has given their agent.
    inputs:
      - name: mandate_id
        type: string
        required: true
        description: The mandate (permission slip) the agent presented with its order.
      - name: merchant
        type: string
        required: true
        description: The shop's registered identifier.
      - name: amount
        type: object
        required: true
        description: The value and currency of the purchase.
      - name: category
        type: string
        required: false
        description: What is being bought, such as groceries or travel.
    returns: Whether the purchase is allowed, the remaining limit, and the mandate's expiry.
  example_request:
    mandate_id: "mdt_31c9"
    merchant: "merchant_freshbasket_ie"
    amount: { value: 86.40, currency: EUR }
    category: groceries
  example_response:
    allowed: true
    owner: "verified person"
    remaining_limit: { value: 113.60, currency: EUR }
    allowed_categories: [groceries, household]
    expires_at: "2026-10-31T23:59:00Z"

faq:
  - q: Does the agent ever see my card number?
    a: No. The agent only ever holds the mandate, a permission slip that is useless outside the exact limits you set.
  - q: What happens when I revoke a mandate?
    a: From that moment, every check against it comes back as "not allowed", so new purchases stop immediately.
  - q: Do shops need to change their checkout?
    a: Only by adding one quick check before accepting an agent order. Everything else about their checkout stays the same.

related: [spend, approvals]
